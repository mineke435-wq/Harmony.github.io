<header><h1>ハモりキー</h1><span id="read">マイクを開始すると声にハモりが付きます</span></header>
<main>
<section><h2>音源・入出力</h2>
<div class="row"><label>音源</label><div class="seg" data-k="src"><button data-v="mic">マイク</button><button data-v="smp">サンプル</button><button data-v="sine">サイン波</button><button data-v="saw">ノコギリ波</button></div></div>
<div class="row" id="rowMic"><label>入力</label><select id="selDev"><option value="">既定の入力</option></select><button id="mic" class="big">マイク開始</button></div>
<div id="boxSmp" hidden><div class="row"><label>音声</label><select id="selSmp"><option value="m1">歌声メロディ（約7秒）</option><option value="m2">ロングトーン（約6秒）</option></select><button class="big" id="play">再生（ループ）</button></div>
<div class="row"><label>ファイル</label><input type="file" id="smpFile" accept="audio/*"></div></div>
<div class="row"><label>出力</label><select id="selOut"><option value="">既定の出力</option></select><button class="big" id="refDev">更新</button></div>
<div class="row"><label>原音</label><input type="range" id="dry" max="100" value="40"><label>ハモり</label><input type="range" id="hv" max="100" value="80"></div>
<div class="row"><label>広がり</label><input type="range" id="wd" max="100" value="60"><label>残響</label><input type="range" id="rv" max="100" value="20"></div>
<div class="row"><label>音量</label><input type="range" id="vol" max="100" value="80"></div>
<div class="hint" id="micMsg">入力＝イヤホンのマイク、出力＝スマホのスピーカー等に分ければハウリングしません。Bluetoothは遅延が増えます。</div></section>
<section><h2>ハーモニー</h2>
<div class="row"><label>声数</label><div class="seg" data-k="voices"><button data-v="2">2声</button><button data-v="3">3声</button><button data-v="4">4声</button></div></div>
<div class="row"><label>方式</label><div class="seg" data-k="mode"><button data-v="man">鍵盤</button><button data-v="par">平行</button><button data-v="scale">スケール</button><button data-v="chord">コード</button></div></div>
<div class="row"><label>向き</label><div class="seg" data-k="dir"><button data-v="-1">下に付ける</button><button data-v="1">上に付ける</button></div></div>
<div class="hint" id="modeHint"></div>
<div class="row" id="rowPar"><label>和音</label><select id="selPar"></select></div>
<div class="row" id="rowKey"><label>キー</label><select id="selKey"></select><select id="selScale"><option value="0">長調</option><option value="1">短調</option></select></div>
<div id="chordBox">
<div class="row"><label>進行</label><select id="selPre"></select></div>
<div class="row"><div id="slots"></div></div>
<div class="row"><label>登録</label><input type="checkbox" id="edit"><span>鍵盤をタップして選択中のコードを自作</span></div>
<div class="row"><label>自動</label><input type="checkbox" id="auto" checked><span>進行を自動で進める</span></div>
<div class="row"><label>テンポ</label><input type="range" id="bpm" min="40" max="180" value="80"><span id="bpmv">80</span><select id="beats"><option>1</option><option selected>2</option><option>4</option></select><span class="hint">拍/和音</span></div>
</div></section>
<section><h2>フィルター・カメラ操作</h2>
<div class="row"><label>種類</label><select id="ftype"><option value="lowpass">ローパス</option><option value="bandpass">バンドパス</option><option value="highpass">ハイパス</option></select></div>
<div class="row"><label>周波数</label><input type="range" id="cut" max="100" value="75"></div>
<div class="row"><label>鋭さ</label><input type="range" id="qq" max="100" value="10"></div>
<div class="row"><label>ビブラ</label><input type="range" id="vib" max="150" value="60"><span class="hint">鍵盤の上スライドの最大深さ</span></div>
<div class="row"><label>カメラ</label><input type="checkbox" id="cam"><span>手と口の動きで操作</span></div>
<div class="row"><canvas id="prev"></canvas><div>
<div class="row"><label>手の縦</label><select id="m_hy"></select></div>
<div class="row"><label>手の横</label><select id="m_hx"></select></div>
<div class="row"><label>口</label><select id="m_mo"></select></div>
<button class="big" id="calib">口を閉じて校正</button></div></div>
<div class="hint" id="camMsg">プレビューをタップすると口の位置（赤枠）を合わせられます。手は動く肌色の部分を追跡します。</div>
</section>
</main>
<div id="kbwrap"><div class="oct"><button id="o-">−8va</button><button id="o+">+8va</button></div><div id="kb"></div></div>
<video id="vid" playsinline muted style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"></video>
<script>
const $=id=>document.getElementById(id),clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const NN=['C','D♭','D','E♭','E','F','F♯','G','A♭','A','B♭','B'];
const PAR=[['長3和音',[4,7,12]],['短3和音',[3,7,12]],['5度＋8度',[7,12,19]],['オクターブ',[12,24,36]]];
const CT={'':[0,4,7],'m':[0,3,7],'7':[0,4,7,10],'M7':[0,4,7,11],'m7':[0,3,7,10],'m7♭5':[0,3,6,10],'dim7':[0,3,6,9],'6':[0,4,7,9],'m6':[0,3,7,9],'sus4':[0,5,7],'7sus4':[0,5,7,10],'add9':[0,4,7,2],'9':[0,4,7,10,2],'M9':[0,4,7,11,2],'m9':[0,3,7,10,2],'7♭9':[0,4,7,10,1],'7♯9':[0,4,7,10,3],'13':[0,4,7,10,2,9],'aug':[0,4,8],'mM7':[0,3,7,11]};
const TM={};for(const t in CT)TM[[...new Set(CT[t].map(x=>x%12))].sort((a,b)=>a-b).join()]=t;
const PRE=[['王道 4-5-3-6',[[5,'M7'],[7,'7'],[4,'m7'],[9,'m']]],['1-5-6-4',[[0,''],[7,''],[9,'m'],[5,'']]],['ジャズ 2-5-1-6',[[2,'m9'],[7,'13'],[0,'M9'],[9,'m7♭5']]],['1-6-2-5 (7th)',[[0,'M7'],[9,'m7'],[2,'m7'],[7,'7']]],['短調 1-♭7-♭6-♭7',[[0,'m'],[10,''],[8,''],[10,'']]],['ゴスペル風',[[0,'add9'],[5,'M9'],[2,'m9'],[7,'7sus4']]]];
const TG=['なし','周波数','鋭さ','ハモり音量','ピッチ'];
const S={wd:.6,rv:.2,src:'mic',out:'',vol:.8,voices:3,mode:'chord',dir:-1,par:0,key:0,minor:false,slots:[],active:0,preset:0,auto:true,bpm:80,beats:2,edit:false,oct:0,cam:false,ftype:'lowpass',cut:.75,q:.1,hv:.8,dry:.4,vib:60,map:{hy:1,hx:3,mo:2}};
let E={};
/* ---- chords ---- */
const setSlot=(i,r,t)=>S.slots[i]={r,t,pcs:CT[t].map(x=>(r+x)%12),name:NN[r]+t};
function nameOf(p){const u=[...new Set(p)];for(const r of u){const k=u.map(x=>(x-r+12)%12).sort((a,b)=>a-b).join();if(TM[k]!==undefined)return NN[r]+TM[k]}return u.length?u.map(x=>NN[x]).join('+'):'―'}
function applyPre(){PRE[S.preset][1].forEach(([o,t],k)=>setSlot(k,(S.key+o)%12,t))}
const sc=()=>S.minor?[0,2,3,5,7,8,10]:[0,2,4,5,7,9,11];
const scalePcs=()=>sc().map(x=>(S.key+x)%12);
function harmonize(m){
  const N=S.voices-1,dir=S.dir;
  if(S.mode==='par')return PAR[S.par][1].slice(0,N).map(x=>m+dir*x);
  const pcs=S.mode==='chord'?S.slots[S.active].pcs:scalePcs(),L=[];
  for(let x=0;x<128;x++)if(pcs.includes(x%12))L.push(x);
  if(!L.length)return[];
  if(S.mode==='chord'){const c=dir<0?L.filter(x=>x<m).reverse():L.filter(x=>x>m);return c.slice(0,N)}
  const ks=[2,4,6].slice(0,N);
  if(dir<0){let i=L.length-1;while(i>0&&L[i]>m)i--;return ks.map(k=>L[Math.max(0,i-k)])}
  let i=0;while(i<L.length-1&&L[i]<m)i++;return ks.map(k=>L[Math.min(L.length-1,i+k)]);
}
/* ---- audio: mic → formant-preserving PSOLA ---- */
const MASK=16383,OM=8191,IR=new Float32Array(MASK+1),AR=[0,1,2].map(()=>new Float32Array(OM+1));
let ctx,filt,master,sp,src,stream,inPos=0,f0=200,T=240,voiced=false,miss=9,curM=60,harm=[],lastSig='';
const V=[0,1,2].map(()=>({next:0,r:1,g:0,tr:1,tg:0,bend:0,vd:0}));
const touches=new Set();
function initAudio(){
  if(ctx)return;
  ctx=new (window.AudioContext||window.webkitAudioContext)();T=ctx.sampleRate/200;
  filt=ctx.createBiquadFilter();master=ctx.createGain();master.gain.value=S.vol;
  const comp=ctx.createDynamicsCompressor();
  sp=ctx.createScriptProcessor(1024,1,4);sp.onaudioprocess=proc;
  const spl=ctx.createChannelSplitter(4);sp.connect(spl);
  pans=[0,1,2,3].map(i=>{const p=ctx.createStereoPanner();spl.connect(p,i);p.connect(filt);return p});
  rev=ctx.createConvolver();rev.buffer=mkIR();revG=ctx.createGain();filt.connect(revG);revG.connect(rev);rev.connect(master);
  filt.connect(master);master.connect(comp);comp.connect(ctx.destination);applyFilter();applySink();applyFx();
}
let osc,og,pans,rev,revG;
function setSource(){
  stopSmp();
  if(S.src==='mic'){stopOsc();$('micMsg').textContent='「マイク開始」を押すと声にハモりが付きます。';return}
  micStop();
  if(S.src==='smp'){stopOsc();$('micMsg').textContent='「再生」を押すとサンプルがループし、ハモりが付きます。音声ファイルも読み込めます。';return}
  initAudio();ctx.resume();
  if(!osc){osc=ctx.createOscillator();og=ctx.createGain();og.gain.value=0;osc.frequency.value=220;osc.connect(og);og.connect(sp);osc.start()}
  osc.type=S.src==='saw'?'sawtooth':'sine';
  $('micMsg').textContent='鍵盤を押すと音源が鳴り、ハモりが付きます。横スライド＝ピッチ、上スライド＝ビブラート。';
}
const FM={a:[800,1200,2800],i:[300,2300,3000],u:[350,1300,2500],e:[500,1900,2600],o:[450,800,2600]};
const SM={m1:[[55,1,'a'],[59,1,'o'],[62,1,'a'],[59,1,'e'],[60,1,'i'],[57,1,'u'],[55,1,'o'],[55,2,'a']],m2:[[57,4,'a'],[60,4,'o']]};
const SB={};let smpSrc=null,smpBusy=false;
async function genVoice(k){
  const sr=44100,bt=.75,M=SM[k],len=M.reduce((a,n)=>a+n[1],0)*bt+.3,oc=new OfflineAudioContext(1,Math.ceil(len*sr),sr);
  const o=oc.createOscillator(),lf=oc.createOscillator(),lg=oc.createGain(),env=oc.createGain(),mix=oc.createGain();
  o.type='sawtooth';o.frequency.value=440*Math.pow(2,(M[0][0]-69)/12);lf.frequency.value=5.2;lg.gain.value=12;lf.connect(lg);lg.connect(o.detune);o.connect(env);
  const fs=[0,1,2].map(i=>{const f=oc.createBiquadFilter();f.type='bandpass';f.Q.value=[6,8,10][i];const g=oc.createGain();g.gain.value=[1,.7,.4][i];env.connect(f);f.connect(g);g.connect(mix);return f});
  mix.connect(oc.destination);env.gain.value=0;
  let t=.05;
  M.forEach(([m,b,v])=>{
    const d=b*bt,f=440*Math.pow(2,(m-69)/12);
    o.frequency.setTargetAtTime(f,t,.03);fs.forEach((x,i)=>x.frequency.setTargetAtTime(FM[v][i],t,.04));
    env.gain.setTargetAtTime(1,t,.03);env.gain.setTargetAtTime(.3,t+d-.07,.02);t+=d;
  });
  env.gain.setTargetAtTime(0,t-.07,.05);
  o.start();lf.start();
  const r=await oc.startRendering(),ch=r.getChannelData(0);let pk=0;for(let i=0;i<ch.length;i++)pk=Math.max(pk,Math.abs(ch[i]));
  const sc=pk?.6/pk:1;for(let i=0;i<ch.length;i++)ch[i]*=sc;return r;
}
async function toggleSmp(){
  if(smpSrc){stopSmp();return}
  if(smpBusy)return;smpBusy=true;
  try{
    initAudio();await ctx.resume();
    const k=$('selSmp').value;
    if(!SB[k]){$('micMsg').textContent='サンプルを生成中…';SB[k]=await genVoice(k)}
    if(S.src!=='smp')return;
    const b=SB[k];smpSrc=ctx.createBufferSource();smpSrc.buffer=b;smpSrc.loop=true;smpSrc.loopEnd=Math.min(b.duration,20);smpSrc.connect(sp);smpSrc.start();
    $('play').textContent='停止';$('play').classList.add('on');$('micMsg').textContent='ループ再生中。ハモりが付きます。';
  }catch(err){$('micMsg').textContent='サンプルを再生できません（'+err.name+'）'}
  finally{smpBusy=false}
}
function stopSmp(){
  if(smpSrc){try{smpSrc.stop()}catch(e){}smpSrc.disconnect();smpSrc=null}
  $('play').textContent='再生（ループ）';$('play').classList.remove('on');
}
async function loadFile(e){
  const f=e.target.files[0];if(!f)return;
  try{
    initAudio();SB.file=await ctx.decodeAudioData(await f.arrayBuffer());
    let o=[...$('selSmp').options].find(x=>x.value==='file');if(!o){o=new Option('','file');$('selSmp').add(o)}
    o.textContent=f.name.slice(0,18);$('selSmp').value='file';stopSmp();toggleSmp();
  }catch(err){$('micMsg').textContent='音声ファイルを読み込めません（'+err.name+'）'}
}
function stopOsc(){if(osc){osc.stop();osc.disconnect();og.disconnect();osc=og=null}}
function srcCtl(t){
  if(!osc)return;const c=ctx.currentTime;
  if(t)osc.frequency.value=440*Math.pow(2,(t.midi-69)/12+(t.bend+t.vib*S.vib*Math.sin(6.283*5.5*c))/1200);
  og.gain.setTargetAtTime(t?.5:0,c,.015);
}
async function applySink(){
  if(!ctx||!ctx.setSinkId)return;
  try{await ctx.setSinkId(S.out||'')}catch(e){$('micMsg').textContent='出力先を切り替えできません（'+e.name+'）'}
}
async function listDevs(){
  try{
    const ds=await navigator.mediaDevices.enumerateDevices();
    const fill=(el,k,def,cur)=>{el.innerHTML='<option value="">'+def+'</option>'+ds.filter(d=>d.kind===k&&d.deviceId&&d.deviceId!=='default').map((d,i)=>'<option value="'+d.deviceId+'">'+(d.label||(k==='audioinput'?'マイク':'スピーカー')+(i+1))+'</option>').join('');el.value=[...el.options].some(o=>o.value===cur)?cur:''};
    fill($('selDev'),'audioinput','既定の入力',$('selDev').value);
    fill($('selOut'),'audiooutput','既定の出力',S.out);
  }catch(e){}
  const ok=!!(window.AudioContext&&AudioContext.prototype.setSinkId);
  $('selOut').disabled=!ok;if(!ok)$('selOut').options[0].textContent='端末の設定に従う（このブラウザでは切替不可）';
}
function mkIR(){const sr=ctx.sampleRate,L=Math.floor(sr*1.8),b=ctx.createBuffer(2,L,sr);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<L;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/L,3)}return b}
function applyFx(){
  if(!ctx||!pans)return;const t=ctx.currentTime,P=[0,-1,1,0];
  pans.forEach((p,i)=>p.pan.setTargetAtTime(P[i]*S.wd,t,.03));
  revG.gain.setTargetAtTime(S.rv*.8,t,.05);
}
function applyFilter(){
  if(!ctx)return;const t=ctx.currentTime;
  filt.type=S.ftype;filt.frequency.setTargetAtTime(100*Math.pow(100,E.cut),t,.04);filt.Q.setTargetAtTime(.7+E.q*14,t,.04);
}
function detect(end){
  const W=1280,sr=ctx.sampleRate,lo=Math.floor(sr/700),hi=Math.floor(sr/70),b0=end-W;
  let e=0;for(let i=0;i<W;i+=4){const x=IR[(b0+i)&MASK];e+=x*x}
  if(e/(W/4)<1.5e-4)return 0;
  const ns=new Float32Array(hi+3);let best=0;
  for(let l=lo-1;l<=hi+1;l++){
    let a=0,b=0;
    for(let i=0;i<W-hi-2;i+=2){const x=IR[(b0+i)&MASK],y=IR[(b0+i+l)&MASK];a+=x*y;b+=x*x+y*y}
    ns[l]=b?2*a/b:0;if(l>=lo&&ns[l]>best)best=ns[l];
  }
  if(best<.55)return 0;
  for(let l=lo;l<=hi;l++)if(ns[l]>=.8*best&&ns[l]>ns[l-1]&&ns[l]>=ns[l+1]){
    const d=ns[l-1]-2*ns[l]+ns[l+1];return sr/(l+(d?(ns[l-1]-ns[l+1])/(2*d):0));
  }
  return 0;
}
let cf=0,cn=0,fc=0;
function proc(e){
  const inp=e.inputBuffer.getChannelData(0),out=e.outputBuffer.getChannelData(0),N=inp.length,s=inPos,sr=ctx.sampleRate;
  for(let i=0;i<N;i++)IR[(s+i)&MASK]=inp[i];
  inPos=s+N;const end=inPos,f=detect(end);
  if(f){
    miss=0;let fx=f;
    if(voiced){
      const st=12*Math.log2(f/f0),k=Math.round(st/12);
      if(k&&Math.abs(st-12*k)<1.5){if(++fc<7)fx=f/Math.pow(2,k);else{fc=0;voiced=false}}
      else{fc=0;if(Math.abs(st)>4){if(cn&&Math.abs(12*Math.log2(f/cf))<1.5)cn++;else{cf=f;cn=1}if(cn>=4){cn=0;voiced=false}else fx=0}else cn=0}
    }
    if(fx){f0=voiced?f0*.5+fx*.5:fx;voiced=true;T=sr/f0;const m=69+12*Math.log2(f0/440);if(Math.abs(m-curM)>.65)curM=Math.round(m)}
  }
  else if(++miss>3)voiced=false;
  const os=S.src==='sine'||S.src==='saw',ta=[...touches],mt=os?ta[0]:null,tb=os?ta.slice(1):ta,N1=S.voices-1,man=S.mode==='man';
  harm=voiced&&!man?harmonize(curM):[];
  let gb=0,gv=0;tb.forEach(t=>{gb+=t.bend/tb.length;gv=Math.max(gv,t.vib)});if(os){gb=0;gv=0;srcCtl(mt)}
  for(let i=0;i<3;i++){
    const v=V[i];let tr=1,on=false,bend=gb,vd=gv;
    if(i<N1){
      if(man){const t=tb[i];if(t){on=true;bend=t.bend;vd=t.vib;tr=voiced?440*Math.pow(2,(t.midi-69)/12)/f0:1}}
      else if(voiced){if(harm[i]!==undefined){on=true;tr=Math.pow(2,(harm[i]-curM)/12)}}
      else on=true;
    }
    v.tr=clamp(tr,.4,2.5);v.tg=on?E.hv*(voiced?1:.5):0;v.bend=bend+E.bd;v.vd=vd*S.vib;
    v.r+=(v.tr-v.r)*.5;v.g+=(v.tg-v.g)*.4;
    if(v.g<.003&&!v.tg){v.next=end;continue}
    for(let n=0;n<400;n++){
      const rr=clamp(v.r*Math.pow(2,(v.bend+v.vd*Math.sin(6.283*5.5*v.next/sr))/1200),.4,2.5);
      const Ts=T/rr,Lw=Math.ceil(Math.max(T,Ts));
      if(v.next>=end+Lw)break;
      if(v.next<s)v.next=s;
      const p=Math.round(v.next),c0=p-Math.ceil(2*Lw+T)-2,h=T>>1;
      let c=c0,bv=0;
      for(let k=-h;k<=h;k++){const a=Math.abs(IR[(c0+k)&MASK]);if(a>bv){bv=a;c=c0+k}}
      const g=v.g*Ts/Lw;
      for(let k=Math.max(-Lw,s-p);k<=Lw;k++)AR[i][(p+k)&OM]+=g*(.5+.5*Math.cos(Math.PI*k/Lw))*IR[(c+k)&MASK];
      v.next+=Ts;
    }
  }
  const o1=e.outputBuffer.getChannelData(1),o2=e.outputBuffer.getChannelData(2),o3=e.outputBuffer.getChannelData(3);
  for(let i=0;i<N;i++){const j=(s+i)&OM;out[i]=S.dry*inp[i];o1[i]=AR[0][j];o2[i]=AR[1][j];o3[i]=AR[2][j];AR[0][j]=AR[1][j]=AR[2][j]=0}
  const sig=(voiced?curM:-1)+'|'+harm+'|'+tb.map(t=>t.midi);
  if(sig!==lastSig){lastSig=sig;marks()}
}
async function denyMsg(k){
  const n=k==='cam'?'camera':'microphone',j=k==='cam'?'カメラ':'マイク';
  let st='',bl=false;
  try{st=(await navigator.permissions.query({name:n})).state}catch(e){}
  try{const fp=document.featurePolicy||document.permissionsPolicy;bl=!!fp&&!fp.allowsFeature(n)}catch(e){}
  if(bl)return j+'を使えません：このページを埋め込んでいる側（Claudeアプリ等）が'+j+'を許可していません。ページ側では直せないので、ダウンロードしたファイルをChrome/Safariで開くか、https で公開したURLを開いてください。';
  if(st==='denied')return j+'がこのサイトで拒否されています。ブラウザのサイト設定で許可し、端末の設定でもそのブラウザに'+j+'を許可してください。';
  if(window.top!==window)return j+'を使えません：埋め込み表示では許可ダイアログが出ないことがあります。単体のページとして開いてください。';
  return j+'が許可されていません。端末の設定でこのブラウザの'+j+'を許可し、再読み込みしてください。';
}

const kb=$('kb'),keyEls=[];
function build(){
  kb.innerHTML='';keyEls.length=0;
  const base=48+12*S.oct,wp=[0,2,4,5,7,9,11],W=100/14;let wi=0;
  for(let o=0;o<2;o++)for(let i=0;i<7;i++){
    const m=base+12*o+wp[i],w=document.createElement('div');
    w.className='w';w.dataset.m=m;w.textContent=NN[m%12]+(i==0?Math.floor(m/12)-1:'');kb.appendChild(w);keyEls.push(w);
    if([0,1,3,4,5].includes(i)){const b=document.createElement('div');b.className='b';b.dataset.m=m+1;b.style.left=((wi+1)*W-2.1)+'%';kb.appendChild(b);keyEls.push(b)}
    wi++;

}
function marks(){
  const mel=new Set(),har=new Set(),man=S.mode==='man';
  if(voiced)mel.add(curM);
  (man?[...touches].map(t=>t.midi):harm).forEach(x=>har.add(x));
  const pcs=S.mode==='chord'?S.slots[S.active].pcs:S.mode==='scale'?scalePcs():[];
  keyEls.forEach(k=>{const m=+k.dataset.m;k.classList.toggle('mel',mel.has(m));k.classList.toggle('har',!mel.has(m)&&har.has(m));k.classList.toggle('ct',pcs.includes(m%12))});
  $('read').textContent=(voiced?'声 '+NN[curM%12]+' → ':'声なし　')+(man?[...touches].map(t=>NN[t.midi%12]):harm.map(x=>NN[x%12])).join(' ');
}
const ptr=new Map();
kb.addEventListener('pointerdown',e=>{

    if(i<0)s.pcs.push(p);else s.pcs.splice(i,1);
    s.r=s.t=null;s.name=nameOf(s.pcs);S.preset=-1;$('selPre').value='-1';chordUI();lastSig='';return;

function camLoop(){
  if(!S.cam)return;
  cx.save();cx.translate(CW,0);cx.scale(-1,1);cx.drawImage(vid,0,0,CW,CH);cx.restore();
  const im=cx.getImageData(0,0,CW,CH),d=im.data,cur=new Uint8Array(CW*CH);let sx=0,sy=0,c=0;

    if(prev&&Math.abs(y-prev[i])>20){const cb=128-.169*r-.331*g+.5*b,cr=128+.5*r-.419*g-.081*b;
