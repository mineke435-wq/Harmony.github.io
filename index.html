<style>
:root{--bg:#eef1ee;--panel:#fff;--ink:#17252a;--mute:#5d6d72;--acc:#0f8b8d;--har:#d6336c;--line:#cfd8d6;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1619;--panel:#162126;--ink:#e8efee;--mute:#8fa3a7;--acc:#43d0c4;--har:#ff6f9c;--line:#263840;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1619;--panel:#162126;--ink:#e8efee;--mute:#8fa3a7;--acc:#43d0c4;--har:#ff6f9c;--line:#263840;color-scheme:dark}
html{height:100%}
html,body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{position:fixed;inset:0;height:auto;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
@media (display-mode:standalone),(display-mode:fullscreen){body{background:var(--bg)}}
body{height:100%;margin:0;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:14px/1.5 "M PLUS Rounded 1c",system-ui,sans-serif}
header{display:flex;justify-content:space-between;align-items:baseline;padding:8px 14px;gap:10px}
h1{font-size:17px;margin:0;white-space:nowrap}
#read{font-size:12px;color:var(--mute);text-align:right}

section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:8px}

.row{display:flex;align-items:center;gap:8px;margin:5px 0;flex-wrap:wrap}
.row>label{width:3.4em;color:var(--mute);font-size:12px;flex:none}

.w.mel{background:var(--acc);color:#fff}.b.mel{background:var(--acc)}

<header><h1>ハモりキー</h1><span id="read">マイクを開始すると声にハモりが付きます</span></header>
<main>
<section><h2>声の入力（イヤホンのマイク）</h2>
<div class="row"><button id="mic" class="big">マイク開始</button><select id="selDev"><option value="">既定の入力</option></select></div>
<div class="row"><label>原声</label><input type="range" id="dry" max="100" value="40"><label>ハモり</label><input type="range" id="hv" max="100" value="80"></div>
<div class="hint" id="micMsg">イヤホン推奨（スピーカーだとハウリング）。Bluetoothは遅延が増えます。声のフォルマントは保ったまま音程だけ変えます（PSOLA）。</div></section>
<section><h2>ハーモニー</h2>
<div class="row"><label>声数</label><div class="seg" data-k="voices"><button data-v="2">2声</button><button data-v="3">3声</button><button data-v="4">4声</button></div></div>
<div class="row"><label>方式</label><div class="seg" data-k="mode"><button data-v="man">鍵盤</button><button data-v="par">平行</button><button data-v="scale">スケール</button><button data-v="chord">コード</button></div></div>
<div class="row"><label>向き</label><div class="seg" data-k="dir"><button data-v="-1">下に付ける</button><button data-v="1">上に付ける</button></div></div>
<div class="hint" id="modeHint"></div>
<div class="row" id="rowPar"><label>和音</label><select id="selPar"></select></div>
<div class="row" id="rowKey"><label>キー</label><select id="selKey"></select><select id="selScale"><option value="0">長調</option><option value="1">短調</option></select></div>
<div id="chordBox">
<div class="row"><label>進行</label><select id="selPre"></select></div>
<div class="row"><div id="slots"></div></div>
<div class="row"><label>登録</label><input type="checkbox" id="edit"><span>鍵盤をタップして選択中のコードを自作</span></div>
<div class="row"><label>自動</label><input type="checkbox" id="auto" checked><span>進行を自動で進める</span></div>
<div class="row"><label>テンポ</label><input type="range" id="bpm" min="40" max="180" value="80"><span id="bpmv">80</span><select id="beats"><option>1</option><option selected>2</option><option>4</option></select><span class="hint">拍/和音</span></div>
</div></section>
<section><h2>フィルター・カメラ操作</h2>
<div class="row"><label>種類</label><select id="ftype"><option value="lowpass">ローパス</option><option value="bandpass">バンドパス</option><option value="highpass">ハイパス</option></select></div>
<div class="row"><label>周波数</label><input type="range" id="cut" max="100" value="75"></div>
<div class="row"><label>鋭さ</label><input type="range" id="qq" max="100" value="10"></div>
<div class="row"><label>ビブラ</label><input type="range" id="vib" max="150" value="60"><span class="hint">鍵盤の上スライドの最大深さ</span></div>
<div class="row"><label>カメラ</label><input type="checkbox" id="cam"><span>手と口の動きで操作</span></div>
<div class="row"><canvas id="prev"></canvas><div>
<div class="row"><label>手の縦</label><select id="m_hy"></select></div>
<div class="row"><label>手の横</label><select id="m_hx"></select></div>
<div class="row"><label>口</label><select id="m_mo"></select></div>
<button class="big" id="calib">口を閉じて校正</button></div></div>
<div class="hint" id="camMsg">プレビューをタップすると口の位置（赤枠）を合わせられます。手は動く肌色の部分を追跡します。</div>
</section>
</main>
<div id="kbwrap"><div class="oct"><button id="o-">−8va</button><button id="o+">+8va</button></div><div id="kb"></div></div>
<video id="vid" playsinline muted style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"></video>
<script>
const $=id=>document.getElementById(id),clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const NN=['C','D♭','D','E♭','E','F','F♯','G','A♭','A','B♭','B'];
const PAR=[['長3和音',[4,7,12]],['短3和音',[3,7,12]],['5度＋8度',[7,12,19]],['オクターブ',[12,24,36]]];
const CT={'':[0,4,7],'m':[0,3,7],'7':[0,4,7,10],'M7':[0,4,7,11],'m7':[0,3,7,10],'m7♭5':[0,3,6,10],'dim7':[0,3,6,9],'6':[0,4,7,9],'m6':[0,3,7,9],'sus4':[0,5,7],'7sus4':[0,5,7,10],'add9':[0,4,7,2],'9':[0,4,7,10,2],'M9':[0,4,7,11,2],'m9':[0,3,7,10,2],'7♭9':[0,4,7,10,1],'7♯9':[0,4,7,10,3],'13':[0,4,7,10,2,9],'aug':[0,4,8],'mM7':[0,3,7,11]};
const TM={};for(const t in CT)TM[[...new Set(CT[t].map(x=>x%12))].sort((a,b)=>a-b).join()]=t;
const PRE=[['王道 4-5-3-6',[[5,'M7'],[7,'7'],[4,'m7'],[9,'m']]],['1-5-6-4',[[0,''],[7,''],[9,'m'],[5,'']]],['ジャズ 2-5-1-6',[[2,'m9'],[7,'13'],[0,'M9'],[9,'m7♭5']]],['1-6-2-5 (7th)',[[0,'M7'],[9,'m7'],[2,'m7'],[7,'7']]],['短調 1-♭7-♭6-♭7',[[0,'m'],[10,''],[8,''],[10,'']]],['ゴスペル風',[[0,'add9'],[5,'M9'],[2,'m9'],[7,'7sus4']]]];
const TG=['なし','周波数','鋭さ','ハモり音量','ピッチ'];
const S={voices:3,mode:'chord',dir:-1,par:0,key:0,minor:false,slots:[],active:0,preset:0,auto:true,bpm:80,beats:2,edit:false,oct:0,cam:false,ftype:'lowpass',cut:.75,q:.1,hv:.8,dry:.4,vib:60,map:{hy:1,hx:3,mo:2}};
let E={};
/* ---- chords ---- */
const setSlot=(i,r,t)=>S.slots[i]={r,t,pcs:CT[t].map(x=>(r+x)%12),name:NN[r]+t};
function nameOf(p){const u=[...new Set(p)];for(const r of u){const k=u.map(x=>(x-r+12)%12).sort((a,b)=>a-b).join();if(TM[k]!==undefined)return NN[r]+TM[k]}return u.length?u.map(x=>NN[x]).join('+'):'―'}
function applyPre(){PRE[S.preset][1].forEach(([o,t],k)=>setSlot(k,(S.key+o)%12,t))}
const sc=()=>S.minor?[0,2,3,5,7,8,10]:[0,2,4,5,7,9,11];
const scalePcs=()=>sc().map(x=>(S.key+x)%12);
function harmonize(m){
  const N=S.voices-1,dir=S.dir;
  if(S.mode==='par')return PAR[S.par][1].slice(0,N).map(x=>m+dir*x);
  const pcs=S.mode==='chord'?S.slots[S.active].pcs:scalePcs(),L=[];
  for(let x=0;x<128;x++)if(pcs.includes(x%12))L.push(x);
  if(!L.length)return[];
  if(S.mode==='chord'){const c=dir<0?L.filter(x=>x<m).reverse():L.filter(x=>x>m);return c.slice(0,N)}
  const ks=[2,4,6].slice(0,N);
  if(dir<0){let i=L.length-1;while(i>0&&L[i]>m)i--;return ks.map(k=>L[Math.max(0,i-k)])}
  let i=0;while(i<L.length-1&&L[i]<m)i++;return ks.map(k=>L[Math.min(L.length-1,i+k)]);
}
/* ---- audio: mic → formant-preserving PSOLA ---- */
const MASK=16383,OM=8191,IR=new Float32Array(MASK+1),AR=new Float32Array(OM+1);
let ctx,filt,master,sp,src,stream,inPos=0,f0=200,T=240,voiced=false,miss=9,curM=60,harm=[],lastSig='';
const V=[0,1,2].map(()=>({next:0,r:1,g:0,tr:1,tg:0,bend:0,vd:0}));
const touches=new Set();
function initAudio(){
  if(ctx)return;
  ctx=new (window.AudioContext||window.webkitAudioContext)();T=ctx.sampleRate/200;
  filt=ctx.createBiquadFilter();master=ctx.createGain();master.gain.value=.8;
  const comp=ctx.createDynamicsCompressor();
  sp=ctx.createScriptProcessor(1024,1,1);sp.onaudioprocess=proc;
  sp.connect(filt);filt.connect(master);master.connect(comp);comp.connect(ctx.destination);applyFilter();
}
function applyFilter(){
  if(!ctx)return;const t=ctx.currentTime;
  filt.type=S.ftype;filt.frequency.setTargetAtTime(100*Math.pow(100,E.cut),t,.04);filt.Q.setTargetAtTime(.7+E.q*14,t,.04);
}
function detect(end){
  const W=1280,sr=ctx.sampleRate,lo=Math.floor(sr/700),hi=Math.floor(sr/70),b0=end-W;
  let e=0;for(let i=0;i<W;i+=4){const x=IR[(b0+i)&MASK];e+=x*x}
  if(e/(W/4)<1.5e-4)return 0;
  const ns=new Float32Array(hi+3);let best=0;
  for(let l=lo-1;l<=hi+1;l++){
    let a=0,b=0;
    for(let i=0;i<W-hi-2;i+=2){const x=IR[(b0+i)&MASK],y=IR[(b0+i+l)&MASK];a+=x*y;b+=x*x+y*y}
    ns[l]=b?2*a/b:0;if(l>=lo&&ns[l]>best)best=ns[l];
  }
  if(best<.55)return 0;
  for(let l=lo;l<=hi;l++)if(ns[l]>=.8*best&&ns[l]>ns[l-1]&&ns[l]>=ns[l+1]){
    const d=ns[l-1]-2*ns[l]+ns[l+1];return sr/(l+(d?(ns[l-1]-ns[l+1])/(2*d):0));
  }
  return 0;
}
function proc(e){
  const inp=e.inputBuffer.getChannelData(0),out=e.outputBuffer.getChannelData(0),N=inp.length,s=inPos,sr=ctx.sampleRate;
  for(let i=0;i<N;i++)IR[(s+i)&MASK]=inp[i];
  inPos=s+N;const end=inPos,f=detect(end);
  if(f){miss=0;f0=voiced?f0*.5+f*.5:f;voiced=true;T=sr/f0;const m=69+12*Math.log2(f0/440);if(Math.abs(m-curM)>.65)curM=Math.round(m)}
  else if(++miss>3)voiced=false;
  const tb=[...touches],N1=S.voices-1,man=S.mode==='man';
  harm=voiced&&!man?harmonize(curM):[];
  let gb=0,gv=0;tb.forEach(t=>{gb+=t.bend/tb.length;gv=Math.max(gv,t.vib)});
  for(let i=0;i<3;i++){
    const v=V[i];let tr=1,on=false,bend=gb,vd=gv;
    if(i<N1){
      if(man){const t=tb[i];if(t){on=true;bend=t.bend;vd=t.vib;tr=voiced?440*Math.pow(2,(t.midi-69)/12)/f0:1}}
      else if(voiced){if(harm[i]!==undefined){on=true;tr=Math.pow(2,(harm[i]-curM)/12)}}
      else on=true;
    }
    v.tr=clamp(tr,.4,2.5);v.tg=on?E.hv*(voiced?1:.5):0;v.bend=bend+E.bd;v.vd=vd*S.vib;
    v.r+=(v.tr-v.r)*.5;v.g+=(v.tg-v.g)*.4;
    if(v.g<.003&&!v.tg){v.next=end;continue}
    for(let n=0;n<400;n++){
      const rr=clamp(v.r*Math.pow(2,(v.bend+v.vd*Math.sin(6.283*5.5*v.next/sr))/1200),.4,2.5);
      const Ts=T/rr,Lw=Math.ceil(Math.max(T,Ts));
      if(v.next>=end+Lw)break;
      if(v.next<s)v.next=s;
      const p=Math.round(v.next),c0=p-Math.ceil(2*Lw+T)-2,h=T>>1;
      let c=c0,bv=0;
      for(let k=-h;k<=h;k++){const a=Math.abs(IR[(c0+k)&MASK]);if(a>bv){bv=a;c=c0+k}}
      const g=v.g*Ts/Lw;
      for(let k=Math.max(-Lw,s-p);k<=Lw;k++)AR[(p+k)&OM]+=g*(.5+.5*Math.cos(Math.PI*k/Lw))*IR[(c+k)&MASK];
      v.next+=Ts;
    }
  }
  for(let i=0;i<N;i++){const j=(s+i)&OM;out[i]=AR[j]+S.dry*inp[i];AR[j]=0}
  const sig=(voiced?curM:-1)+'|'+harm+'|'+tb.map(t=>t.midi);
  if(sig!==lastSig){lastSig=sig;marks()}
}
async function micStart(){
  const msg=$('micMsg');
  try{
    initAudio();await ctx.resume();
    if(stream)stream.getTracks().forEach(t=>t.stop());
    const id=$('selDev').value;
    stream=await navigator.mediaDevices.getUserMedia({audio:{deviceId:id?{exact:id}:undefined,echoCancellation:false,noiseSuppression:false,autoGainControl:false,channelCount:1}});
    const ds=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='audioinput'),cur=stream.getAudioTracks()[0].getSettings().deviceId;
    $('selDev').innerHTML='<option value="">既定の入力</option>'+ds.map(d=>`<option value="${d.deviceId}">${d.label||'マイク'}</option>`).join('');
    $('selDev').value=ds.some(d=>d.deviceId===id)?id:'';
    if(src)src.disconnect();src=ctx.createMediaStreamSource(stream);src.connect(sp);
    $('mic').textContent='マイク停止';$('mic').classList.add('on');msg.textContent='入力中。歌う・話すと音程を検出してハモりを付けます。';
  }catch(err){msg.textContent='マイクを使えません（'+err.name+'）。ブラウザの許可を確認し、埋め込み表示で拒否される場合は新しいタブでこのページを開いてください。'}
}
function micStop(){
  if(src)src.disconnect();if(stream)stream.getTracks().forEach(t=>t.stop());stream=src=null;
  $('mic').textContent='マイク開始';$('mic').classList.remove('on');
}
$('mic').onclick=()=>stream?micStop():micStart();
$('selDev').onchange=()=>stream&&micStart();
/* ---- keyboard ---- */
const kb=$('kb'),keyEls=[];
function build(){
  kb.innerHTML='';keyEls.length=0;
  const base=48+12*S.oct,wp=[0,2,4,5,7,9,11],W=100/14;let wi=0;
  for(let o=0;o<2;o++)for(let i=0;i<7;i++){
    const m=base+12*o+wp[i],w=document.createElement('div');
    w.className='w';w.dataset.m=m;w.textContent=NN[m%12]+(i==0?Math.floor(m/12)-1:'');kb.appendChild(w);keyEls.push(w);
    if([0,1,3,4,5].includes(i)){const b=document.createElement('div');b.className='b';b.dataset.m=m+1;b.style.left=((wi+1)*W-2.1)+'%';kb.appendChild(b);keyEls.push(b)}
    wi++;
  }
  marks();
}
function marks(){
  const mel=new Set(),har=new Set(),man=S.mode==='man';
  if(voiced)mel.add(curM);
  (man?[...touches].map(t=>t.midi):harm).forEach(x=>har.add(x));
  const pcs=S.mode==='chord'?S.slots[S.active].pcs:S.mode==='scale'?scalePcs():[];
  keyEls.forEach(k=>{const m=+k.dataset.m;k.classList.toggle('mel',mel.has(m));k.classList.toggle('har',!mel.has(m)&&har.has(m));k.classList.toggle('ct',pcs.includes(m%12))});
  $('read').textContent=(voiced?'声 '+NN[curM%12]+' → ':'声なし　')+(man?[...touches].map(t=>NN[t.midi%12]):harm.map(x=>NN[x%12])).join(' ');
}
const ptr=new Map();
kb.addEventListener('pointerdown',e=>{
  const k=e.target.closest('[data-m]');if(!k)return;e.preventDefault();const m=+k.dataset.m;
  if(S.edit){
    const s=S.slots[S.active],p=m%12,i=s.pcs.indexOf(p);
    if(i<0)s.pcs.push(p);else s.pcs.splice(i,1);
    s.r=s.t=null;s.name=nameOf(s.pcs);S.preset=-1;$('selPre').value='-1';chordUI();lastSig='';return;
  }
  kb.setPointerCapture(e.pointerId);
  const n={midi:m,sx:e.clientX,sy:e.clientY,bend:0,vib:0};touches.add(n);ptr.set(e.pointerId,n);
});
kb.addEventListener('pointermove',e=>{
  const n=ptr.get(e.pointerId);if(!n)return;
  n.bend=clamp((e.clientX-n.sx)/(kb.clientWidth/14)*170,-1200,1200);
  n.vib=clamp((n.sy-e.clientY)/(kb.clientHeight*.5),0,1);
});
const up=e=>{const n=ptr.get(e.pointerId);if(n){touches.delete(n);ptr.delete(e.pointerId);lastSig=''}};
kb.addEventListener('pointerup',up);kb.addEventListener('pointercancel',up);
/* ---- UI ---- */
const HINT={man:'押した鍵盤の高さで声をハモらせます（最大声数−1個まで）。横スライド＝ピッチ、上スライド＝ビブラート。',par:'歌った音から固定の音程で付けます。鍵盤のスライドは全体のピッチ／ビブラートになります。',scale:'キーと調に沿って歌った音から3度重ねで付けます。',chord:'選択中のコードの構成音から、歌った音に近い音を選んで付けます。'};
function syncSeg(){
  document.querySelectorAll('.seg[data-k]').forEach(s=>s.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(S[s.dataset.k])===b.dataset.v)));
  $('rowPar').hidden=S.mode!=='par';$('rowKey').hidden=S.mode==='par'||S.mode==='man';$('chordBox').hidden=S.mode!=='chord';$('modeHint').textContent=HINT[S.mode];
}
document.querySelectorAll('.seg[data-k]').forEach(s=>s.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const v=b.dataset.v;S[s.dataset.k]=isNaN(+v)?v:+v;syncSeg();chordUI();restartTimer();lastSig='';
}));
$('selPar').innerHTML=PAR.map((p,i)=>`<option value="${i}">${p[0]}</option>`).join('');
$('selKey').innerHTML=NN.map((n,i)=>`<option value="${i}">${n}</option>`).join('');
$('selPre').innerHTML='<option value="-1">（自作）</option>'+PRE.map((p,i)=>`<option value="${i}">${p[0]}</option>`).join('');
$('selPar').onchange=e=>S.par=+e.target.value;
$('selKey').onchange=e=>{S.key=+e.target.value;if(S.preset>=0)applyPre();chordUI();lastSig=''};
$('selScale').onchange=e=>{S.minor=e.target.value==='1';lastSig=''};
$('selPre').onchange=e=>{S.preset=+e.target.value;if(S.preset>=0)applyPre();chordUI();lastSig=''};
const slotsEl=$('slots');
for(let i=0;i<4;i++){
  const d=document.createElement('div');d.className='slot';
  d.innerHTML='<button class="cb"></button><select>'+NN.map((n,k)=>`<option value="${k}">${n}</option>`).join('')+'<option value="-1">–</option></select><select>'+Object.keys(CT).map(t=>`<option value="${t}">${t||'maj'}</option>`).join('')+'<option value="-">–</option></select>';
  slotsEl.appendChild(d);
  const [cb,sr,st]=d.children;
  cb.onclick=()=>{S.active=i;tick=0;chordUI();lastSig=''};
  sr.onchange=st.onchange=()=>{setSlot(i,+sr.value<0?S.key:+sr.value,st.value==='-'?'':st.value);S.preset=-1;$('selPre').value='-1';chordUI();lastSig=''};
}
function chordUI(){
  [...slotsEl.children].forEach((d,i)=>{
    const s=S.slots[i],[cb,sr,st]=d.children;
    cb.textContent=s.name;cb.classList.toggle('act',i===S.active);sr.value=s.r==null?-1:s.r;st.value=s.t==null?'-':s.t;
  });
}
let tick=0,timer;
function restartTimer(){
  clearInterval(timer);if(!S.auto||S.mode!=='chord')return;tick=0;
  timer=setInterval(()=>{if(++tick>=S.beats){tick=0;S.active=(S.active+1)%4;chordUI();lastSig=''}},60000/S.bpm);
}
const eff=()=>{
  E={cut:S.cut,q:S.q,hv:S.hv,bd:0};
  if(S.cam)for(const k in S.map){const t=S.map[k],v=CV[k];if(t==1)E.cut=v;else if(t==2)E.q=v*.9;else if(t==3)E.hv=v;else if(t==4)E.bd=(v-.5)*200}
  applyFilter();
};
$('edit').onchange=e=>S.edit=e.target.checked;
$('auto').onchange=e=>{S.auto=e.target.checked;restartTimer()};
$('bpm').oninput=e=>{S.bpm=+e.target.value;$('bpmv').textContent=S.bpm;restartTimer()};
$('beats').onchange=e=>{S.beats=+e.target.value;restartTimer()};
$('hv').oninput=e=>{S.hv=e.target.value/100;eff()};
$('dry').oninput=e=>S.dry=e.target.value/100;
$('vib').oninput=e=>S.vib=+e.target.value;
$('ftype').onchange=e=>{S.ftype=e.target.value;applyFilter()};
$('cut').oninput=e=>{S.cut=e.target.value/100;eff()};
$('qq').oninput=e=>{S.q=e.target.value/100;eff()};
$('o-').onclick=()=>{S.oct=Math.max(-1,S.oct-1);build()};
$('o+').onclick=()=>{S.oct=Math.min(2,S.oct+1);build()};
/* ---- camera: hand (moving skin) + mouth opening ---- */
const CW=80,CH=60,vid=$('vid'),cv=document.createElement('canvas');cv.width=CW;cv.height=CH;
const cx=cv.getContext('2d',{willReadFrequently:true}),pv=$('prev'),pc=pv.getContext('2d');pv.width=CW;pv.height=CH;
let prev=null,hx=.5,hy=.5,mo=0,mx=.5,my=.65,base=.9,ratio=.9,cs=null;
const CV={hx:.5,hy:.5,mo:0},nz=v=>clamp((v-.15)/.7,0,1);
['hy','hx','mo'].forEach(k=>{const s=$('m_'+k);s.innerHTML=TG.map((t,i)=>`<option value="${i}">${t}</option>`).join('');s.value=S.map[k];s.onchange=()=>{S.map[k]=+s.value;eff()}});
function camLoop(){
  if(!S.cam)return;
  cx.save();cx.translate(CW,0);cx.scale(-1,1);cx.drawImage(vid,0,0,CW,CH);cx.restore();
  const im=cx.getImageData(0,0,CW,CH),d=im.data,cur=new Uint8Array(CW*CH);let sx=0,sy=0,c=0;
  for(let i=0;i<CW*CH;i++){
    const r=d[i*4],g=d[i*4+1],b=d[i*4+2],y=.299*r+.587*g+.114*b;cur[i]=y;
    if(prev&&Math.abs(y-prev[i])>20){const cb=128-.169*r-.331*g+.5*b,cr=128+.5*r-.419*g-.081*b;
      if(cb>77&&cb<127&&cr>133&&cr<173){sx+=i%CW;sy+=(i/CW)|0;c++;d[i*4]=67;d[i*4+1]=208;d[i*4+2]=196}}
  }
  prev=cur;
  if(c>12){hx+=(sx/c/CW-hx)*.35;hy+=(sy/c/CH-hy)*.35}
  const cxp=Math.round(mx*CW),cyp=Math.round(my*CH);let so=0,no=0,si=0,ni=0;
  for(let y=Math.max(0,cyp-11);y<Math.min(CH,cyp+11);y++)for(let x=Math.max(0,cxp-17);x<Math.min(CW,cxp+17);x++){
    const v=cur[y*CW+x];so+=v;no++;if(Math.abs(x-cxp)<7&&Math.abs(y-cyp)<4){si+=v;ni++}
  }
  ratio=ni&&so?(si/ni)/(so/no):base;
  mo+=(clamp((base-ratio)/.3,0,1)-mo)*.4;
  CV.hx=nz(hx);CV.hy=nz(1-hy);CV.mo=mo;eff();
  pc.putImageData(im,0,0);
  pc.strokeStyle='#ff6f9c';pc.strokeRect(cxp-7,cyp-4,14,8);pc.fillStyle='#fff';pc.fillRect(hx*CW-2,hy*CH-2,4,4);
  requestAnimationFrame(camLoop);
}
pv.onclick=e=>{const r=pv.getBoundingClientRect();mx=(e.clientX-r.left)/r.width;my=(e.clientY-r.top)/r.height};
$('calib').onclick=()=>{base=ratio};
$('cam').onchange=async e=>{
  if(!e.target.checked){S.cam=false;if(cs)cs.getTracks().forEach(t=>t.stop());cs=null;eff();return}
  try{
    cs=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:320,height:240},audio:false});
    vid.srcObject=cs;await vid.play();prev=null;S.cam=true;$('camMsg').textContent='口を閉じた状態で「校正」を押してください。赤枠をタップで口の位置に移動できます。';camLoop();
  }catch(err){e.target.checked=false;S.cam=false;$('camMsg').textContent='カメラを使えません（'+err.name+'）。許可を確認するか、新しいタブでこのページを開いてください。'}
};
document.addEventListener('visibilitychange',()=>{if(document.hidden){touches.clear();ptr.clear()}});
applyPre();S.active=0;eff();syncSeg();chordUI();build();restartTimer();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
